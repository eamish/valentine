<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aya 💖</title>
  <style>
    body {
      background: linear-gradient(to bottom, #ffe6f0, #fff);
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin-top: 80px;
      overflow: hidden;
    }

    h1 {
      color: #ff3366;
      font-size: 42px;
    }

    p {
      font-size: 22px;
      color: #444;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
      transition: 0.2s;
    }

    #yes {
      background-color: #ff3366;
      color: white;
      left: 42%;
      top: 330px;
      box-shadow: 0 8px 20px rgba(255,51,102,0.4);
    }

    #no {
      background-color: #aaa;
      color: white;
      left: 55%;
      top: 330px;
    }

    .heart {
      position: fixed;
      color: #ff3366;
      font-size: 20px;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>Aya 💕</h1>
  <p>Will you be my Valentine? 🌹</p>

  <button id="yes" onclick="yesClicked()">Yes 💖</button>
  <button id="no" onmouseover="moveNo()">No 💔</button>

  <!-- Music (hidden until Yes is clicked) -->
  <iframe id="music"
    width="0"
    height="0"
    src=""
    allow="autoplay"
  ></iframe>

  <script>
    function yesClicked() {
      document.body.innerHTML = `
        <h1>Aya 🥰</h1>
        <p>You just made my heart the happiest ❤️</p>
        <p>From Egypt 🇪🇬 to India 🇮🇳 — our vibes match ✨</p>
        <p><strong>Ishq Risk</strong> is playing just for you 🎶</p>
      `;

      // Play Ishq Risk (YouTube)
      document.body.innerHTML += `
        <iframe width="0" height="0"
        src="https://www.youtube.com/embed/1FMmKzjJ5s8?autoplay=1"
        allow="autoplay"></iframe>
      `;

      // hearts animation
      setInterval(createHeart, 300);
    }

    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 120);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 5000);
    }
  </script>

</body>
</html>
