<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aya 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(to bottom, #ffe6f0, #fff);
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  color: #ff3366;
  font-size: 42px;
  margin-top: 80px;
}

p {
  font-size: 22px;
  color: #444;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  position: absolute;
}

#yes {
  background-color: #ff3366;
  color: white;
  left: 40%;
  top: 320px;
}

#no {
  background-color: #aaa;
  color: white;
  left: 55%;
  top: 320px;
}

#final {
  display: none;
}

.heart {
  position: fixed;
  font-size: 22px;
  animation: float 5s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div id="question">
  <h1>Aya 💕</h1>
  <p>Will you be my Valentine? 🌹</p>

  <button id="yes">Yes 💖</button>
  <button id="no">No 💔</button>
</div>

<div id="final">
  <h1>Aya 🥰</h1>
  <p>You just made my heart the happiest ❤️</p>
  <p>From Egypt 🇪🇬 to India 🇮🇳 — our vibes match ✨</p>
  <p>Ishq Risk is playing just for you 🎶</p>
</div>

<!-- Music -->
<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const question = document.getElementById("question");
const final = document.getElementById("final");
const music = document.getElementById("music");

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 120);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

yesBtn.addEventListener("click", () => {
  question.style.display = "none";
  final.style.display = "block";
  music.play();
  setInterval(createHeart, 300);
});

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.color = "#ff3366";
  heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}
</script>

</body>
</html>
